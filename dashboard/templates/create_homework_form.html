{%load static%}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel = "stylesheet" href = "https://fonts.googleapis.com/css?family=Poppins">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const formContainer = document.getElementById('question-forms');
            const addButton = document.getElementById('add-question');
            const totalForms = document.getElementById('id_form-TOTAL_FORMS');
            const template = document.getElementById('empty-form');

            if (!template) {
                console.log("form not found");
            }
        
            
            addButton.addEventListener('click', function () {
                const formCount = parseInt(totalForms.value);
                const html = template.innerHTML.replace(/__prefix__/g, formCount);

                const newFormDiv = document.createElement('div');
                newFormDiv.classList.add('question-form');
                newFormDiv.innerHTML = html;

                formContainer.appendChild(newFormDiv);
                totalForms.value = formCount + 1;
            });
          
            formContainer.addEventListener('click', function (e) {
              if (e.target.classList.contains('remove-question')) {
                const questionForm = e.target.closest('.question-form');
                questionForm.remove();
              }
            });

            formContainer.addEventListener('change', function(e){
                console.log('Change event:', e.target.name, e.target.value)
                if (e.target.name.includes ('question_type')){
                    const wrapper = e.target.closest('.question-form');
                    const choiceBlock = wrapper.querySelector('.choice-form-container');
                    
                    console.log('wrapper:', wrapper);
                    console.log('choiceBlock:', choiceBlock);
                    if (e.target.value == 'multiple_choice'){
                        choiceBlock.style.setProperty('display', 'block', 'important');
                    } else {
                        choiceBlock.style.display = 'none';
                    }
                }
            });

            formContainer.addEventListener('click', function (e) {
                // Add new choice to the corresponding .choice-form-container
                if (e.target.classList.contains('add-choice')) {
                  const container = e.target.closest('.choice-form-container');
                  const choicesList = container.querySelector('.choices-list');
                  const totalFormsInput = container.querySelector('input[name$="TOTAL_FORMS"]');
              
                  let total = parseInt(totalFormsInput.value);
                  
                  // Get question index from the prefix
                  const questionDiv = e.target.closest('.question-form');
                  const questionIndexMatch = questionDiv.innerHTML.match(/choices_form-(\d+)/);
                  if (!questionIndexMatch) return;
              
                  const qIndex = questionIndexMatch[1];
              
                  // Create new choice input
                  const newChoice = document.createElement('p');
                  newChoice.innerHTML = `
                    <label for="id_choices_form-${qIndex}-${total}-text">Choice ${total + 1}:</label>
                    <input type="text" name="choices_form-${qIndex}-${total}-text" id="id_choices_form-${qIndex}-${total}-text" />
                  `;
                  choicesList.appendChild(newChoice);
              
                  totalFormsInput.value = total + 1;
                }
              });
          });
    </script>
</head>
<body>
    <form method="post" action = "{%url 'create_homework_form'%}">
        {% csrf_token %}
        
        {{ assignment_form.as_p }}

        {{ formset.management_form }}

        <h3>Questions</h3>
        <div id="question-forms">
            {% for form in formset %}
                <div class = "question-form">    
                    {{ form.as_p }}
                    <button type="button" class="remove-question">Remove Question</button>
                </div>
                
            {% endfor %}
        </div>

        <button type="button" id="add-question">Add Question</button>
    
        <button type="submit">Create Assignment</button>
    </form>
<div id="empty-form" style = "display:none;">    
    
    <div class="question-form">
        {{ empty_question_form.as_p }}

    
        <div class="choice-form-container" style="display: none;">
            <input type="hidden" name="choices_form-__prefix__-TOTAL_FORMS" value="2">
            <input type="hidden" name="choices_form-__prefix__-INITIAL_FORMS" value="0">
            <input type="hidden" name="choices_form-__prefix__-MIN_NUM_FORMS" value="0">
            <input type="hidden" name="choices_form-__prefix__-MAX_NUM_FORMS" value="1000">

            
            <div class = "choices-list">
                <p>
                <label for="id_choices_form-__prefix__-0-text">Choice 1:</label>
                <input type="text" name="choices_form-__prefix__-0-text" id="id_choices_form-__prefix__-0-text">
                </p>

                <p>
                <label for="id_choices_form-__prefix__-1-text">Choice 2:</label>
                <input type="text" name="choices_form-__prefix__-1-text" id="id_choices_form-__prefix__-1-text">
                </p>
            </div>

            <button type=button class="add-choice">Add Option</button>
            
        </div>

        <button type="button" class="remove-question">Remove Question</button>
    </div>
</div>
</body>
</html>
