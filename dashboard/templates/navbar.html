

<div class="top-nav">
        <div class="top-nav-right">
          <a href="{% url 'student_dashboard' %}" 
          class="nav-link {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}">
          Dashboard
        </a>
          <a href="{% url 'editor_view' %}" 
          class="nav-link {% if request.resolver_match.url_name == 'editor_view' %}active{% endif %}">
          Editor
        </a>
      
          {% if user.teacher.is_admin %}
            <a href="{% url 'admin_dashboard' %}" 
            class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            Admin
          </a>
          {% endif %}
      
          <span class="nav-divider"></span>
      
          <span class="user-name">
            {{ user.get_full_name|default:user.username }}
          </span>
      
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="nav-btn">Logout</button>
          </form>
        </div>
    </div>
