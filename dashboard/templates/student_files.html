<!DOCTYPE html>
<html>
<head>
    <title>{{ student.name }}'s Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <h2>{{ student.name }}'s Files</h2>

    {% if files %}
        <ul>
        {% for file in files %}
            <li>
                <i class = "bi bi-file-earmark-code"></i>
                <p>{{ file.file.name |cut:"student_files/"}}</p>
                <a href="{% url 'download_file' file.id %}" >
                    Download
                </a> 
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No files uploaded yet.</p>
    {% endif %}

    <p><a href="{% url 'upload_file' %}">Upload File</a></p>
</body>
</html>
