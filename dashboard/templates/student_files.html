<!DOCTYPE html>
<html>
<head>
    <title>{{ student.name }}'s Files</title>
</head>
<body>
    <h2>{{ student.name }}'s Files</h2>

    {% if files %}
        <ul>
        {% for file in files %}
            <li>
                <a href="{{ file.file.url }}" target="_blank">
                    {{ file.file.name |cut:"student_files/"}}
                </a> uploaded {{ file.uploaded_at}}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No files uploaded yet.</p>
    {% endif %}

    <p><a href="{% url 'upload_file' %}">Upload File</a></p>
</body>
</html>
