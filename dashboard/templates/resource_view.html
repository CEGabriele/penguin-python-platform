<!DOCTYPE html>

<html>

<head>
   <title>{{resource.title}}</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
   <h1>{{resource.title}} - {{resource.for_class.name}}</h1>
   <br>
   <h2>{{resource.text_content}}</h2>

   <form action="{% url 'student_class_view' resource.for_class.code%}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit">Return to {{resource.for_class.name}}</button>
   </form>
</body>

</html>
