<!DOCTYPE html>

<html>

<head>
   <title>{{class.name}} - {{class.day}}</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
   <h1>{{class.name}} - {{class.day}}</h1>
   <h3>{{class.teacher}}</h3>
   <p><b>Email: </b>{{class.teacher.user.email}}</p>
   <br>
   <h3>Resources</h3>
   <ul>
      {%for resource in class.resources.all%}
      <li>
         {%if not resource.locked%}
         <a href="{% url 'resource_view' resource.id %}">
            <p>{{resource.title}}</p>
         </a>

         {%endif%}

      </li>
      {%empty%}
      <li>Nothing to see here.</li>
      {%endfor%}
   </ul>
   <form action="{% url 'student_dashboard' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit">Return to Dashboard</button>
   </form>

</body>

</html>
