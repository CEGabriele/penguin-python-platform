{% load static %}
<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{% static 'admin/css/vendor/select2/select2.css' %}">
    <link rel="stylesheet" href="{% static 'django_select2/django_select2.css' %}">

    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    {{student_form.media}}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-links">
            <a href="{% url 'teacher_dashboard' %}">Teacher Dashboard</a>
            {% if teacher.is_admin %}
                <a href="{% url 'admin_dashboard' %}">Admin Dashboard</a>
            {% endif %}
            <a href ="{% url 'editor_view' %}">Code Editor</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </nav>

    <h1>Class: {{ class_obj.name }}</h1>
    <p> Teacher: {{ class_obj.teacher.user.get_full_name }}</p>
    <h2>Manage Students</h2>
    <form method="post">
        {% csrf_token %}
        {{ student_form.as_p }}
        <button type="submit">Update Students</button>
    </form>

    <br>

</body>
</html>
