{% load static %}
<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {{class_form.media}}
    <link rel = "stylesheet" href = "https://fonts.googleapis.com/css?family=Poppins">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <a href = "{% url 'teacher_dashboard' %}"> Go to dashboard </a> <br>
    
    <form action="{% url 'logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>


    <h2>Create Student</h2>
    <form method="post">
    {% csrf_token %}
    {{ student_form.as_p }}
    <button type="submit" name="create_student">Create Student</button>
    </form>

    <hr>

    <h2>Create Teacher</h2>
    <form method="post">
    {% csrf_token %}
    {{ teacher_form.as_p }}
    <button type="submit" name="create_teacher">Create Teacher</button>
    </form>
    
    <hr>

    <h2>Create a New Class</h2>
    <form method="post">
    {% csrf_token %}
    {{ class_form.as_p }}
    <button type="submit" name = "create_class">Create Class</button>
    </form>
</body>
</html>
