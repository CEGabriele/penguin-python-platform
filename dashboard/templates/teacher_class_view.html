{% load static %}
<!DOCTYPE html>
<html>
<head>
   <title>{{class.name}} - {{class.day}}</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
   <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>

<body>
   <h1>{{class.name}} - {{class.day}}</h1>
   <ul>
      {%for student in class.students.all%}
      <li>{{student.user.get_full_name}}</li>
      {%empty%}
      <li>No students</li>
      {%endfor%}
   </ul>
   <h3>{{student}}</h3>
   <br>
   <form action="{% url 'teacher_dashboard' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit">Return to Dashboard</button>
   </form>

</body>

</html>
